name: api_command_queue
description: Pure Dart command queue primitives for retryable API work,
  terminal failures, and offline-first orchestration.
version: 0.2.0
homepage: https://github.com/tribus-digital/api_command_queue
repository: https://github.com/tribus-digital/api_command_queue
issue_tracker: https://github.com/tribus-digital/api_command_queue/issues
documentation: https://pub.dev/documentation/api_command_queue/latest/
topics:
  - command-queue
  - offline-first
  - retry
  - state-management

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  meta: ^1.16.0
  uuid: ^4.5.2

dev_dependencies:
  fake_async: ^1.3.2
  lints: ^6.1.0
  test: ^1.29.0
